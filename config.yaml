# Application Configuration
app:
  env: "development"
  auth: "firebase" #firebase, custom
  port: 3000
  version: "v99"
  register_enabled: true # enable the email/password registration route

# Forced client update by version NAME (env CLIENT_MIN_VERSION / CLIENT_LATEST_VERSION). A client below the minimum
# gets 426 Upgrade Required; empty = nobody is blocked. Publish the new client BEFORE raising the minimum.
client:
  min_version: "1.0"
  latest_version: ""

# AdMob server-side verification of rewarded ads (env ADS_SSV_AD_UNITS / ADS_REQUIRE_SSV). The callback route
# GET /api/<v>/webhooks/admob/ssv is on when ssv_ad_units is set; require_ssv makes POST /ads/reward wait for it.
# Rollout: deploy with the units and require_ssv=false, ship the client that sets the SSV options, check the logs for
# "[adssv] verified", then deploy with ADS_REQUIRE_SSV=true. Never before the new client is downloadable.
ads:
  ssv_ad_units: ""
  require_ssv: false

# Admin API and panel. Same image, switched per service by env (all off by default):
#   neither flag                      game API only                         (deploy.bat)
#   ADMIN_ENABLED=true                game API + /api/<v>/admin routes      (deploy-admin.bat)
#   + ADMIN_PANEL_ENABLED=true        ... + the embedded panel under /admin (deploy-admin.bat with the flag set)
# Other env overrides: ADMIN_REGISTER_EMAIL, ADMIN_LOGIN_GOOGLE, ADMIN_LOGIN_EMAIL, ADMIN_ACCEPT_CUSTOM_TOKEN, ADMIN_WEB_API_KEY, ADMIN_WEB_AUTH_DOMAIN, ADMIN_WEB_APP_ID
admin:
  enabled: false       # the /api/<v>/admin routes
  panel_enabled: false # the embedded panel (needs enabled)
  register_email: false # POST /admin/register + the panel's "create an account" link (needs enabled and login_email)
  login_google: false # Firebase Google sign-in on the panel (off by default)
  login_email: true   # Firebase email/password sign-in on the panel
  accept_custom_token: false # admin routes also accept an ID token from a signed custom token (Tools/publish_build.py)
  web_api_key: ""     # Firebase Web app config (public values)
  web_auth_domain: ""
  web_app_id: ""

# Firebase
firebase:
  enabled: true
  project_id: "additive-idle-simulation"
  credentials_file_path: "" # 本地開發可填寫路徑；在 GCP Cloud Run 環境留空即可（自動套用 GCP ADC 認證）
  use_firestore: true
  use_storage: false
  storage_bucket: "my-game-bucket.appspot.com"
  use_message: false

# Database Configuration
database:
  master:
    host: "postgres"
    port: 5432
    user: "game_user"
    password: "game_password"
    dbname: "game_db"
  readonly:
    host: "postgres"
    port: 5432
    user: "game_user"
    password: "game_password"
    dbname: "game_db"

# Redis Configuration
redis:
  host: "redis"
  port: 6379
  password: "redis_password"
  db: 0

# Elasticsearch Configuration
elastic:
  addresses:
    - "http://elasticsearch:9200"
  username: "elastic"
  password: "local_pass"

# Session Configuration
session:
  secret_key: "c2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtMzA4OQ" # 32-bytes (256-bit) Base64 encoded secret
  issuer: "api-library"
  access_ttl: "15m"
  refresh_ttl: "168h"

# Webhook Configuration
webhook:
  meta:
    payment:
      enabled: true
      verify_token: "123456789"

meta:
  platform_server: "https://graph.oculus.com"
  app_id: "your_app_id"
  app_secret: "your_app_secret"
  attestation:
    enabled: false
