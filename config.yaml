# Application Configuration
app:
  env: "development"
  port: 3000
  version: "v99"

# Database Configuration
database:
  master:
    host: "postgres"
    port: 5432
    user: "game_user"
    password: "game_password"
    dbname: "game_db"
  readonly:
    host: "postgres"
    port: 5432
    user: "game_user"
    password: "game_password"
    dbname: "game_db"

# Redis Configuration
redis:
  host: "redis"
  port: 6379
  password: "redis_password"
  db: 0

# Elasticsearch Configuration
elastic:
  addresses:
    - "http://elasticsearch:9200"
  username: "elastic"
  password: "local_pass"

# Session Configuration
session:
  secret_key: "c2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtMzA4OQ" # 32-bytes (256-bit) Base64 encoded secret
  issuer: "api-library"
  access_ttl: "15m"
  refresh_ttl: "168h"

# Webhook Configuration
webhook:
  meta_payment:
    verify_token: "123456789"
    app_secret: "app_secret"
