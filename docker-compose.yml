networks:
  game-net:
    name: game-net
    driver: bridge

volumes:
  pgdata:
  redisdata:
  esdata:
  go-pkg-mod:

services:
  # ---------------------------------------------------------------------------
  # API Service
  # ---------------------------------------------------------------------------
  api:
    image: golang:1.26-alpine
    container_name: game_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - go-pkg-mod:/go/pkg/mod # caches modules so it doesn't redownload on restart
    ports:
      - "3000:3000"
    command: go run ./internal/cmd/api
    networks:
      - game-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgreSQL Service
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_password
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - game-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U game_user -d game_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Service (In-Memory Data / Presence / Caching)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: game_redis
    restart: unless-stopped
    # Enables AOF (Append Only File) persistence for presence/session safety
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - game-net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis_password", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Adminer - Lightweight SQL UI
  adminer:
    image: adminer:latest
    container_name: game_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - game-net
    depends_on:
      - postgres

  # pgAdmin4 - Official PostgreSQL GUI
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: game_pgadmin
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin_password
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - gofiber-net
  #   depends_on:
  #     - postgres

  # Redis Commander - Web UI for Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: game_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis_password
    ports:
      - "8081:8081"
    networks:
      - game-net
    depends_on:
      - redis

  # ---------------------------------------------------------------------------
  # Elasticsearch Service
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.19.22
    container_name: game_elasticsearch
    restart: unless-stopped
    environment:
      - node.name=game_elasticsearch
      - discovery.type=single-node
      - ELASTIC_PASSWORD=local_pass
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - game-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -u elastic:local_pass -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kibana Service
  # ---------------------------------------------------------------------------
  kibana:
    image: kibana:8.19.22
    container_name: game_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=local_pass
    ports:
      - "5601:5601"
    networks:
      - game-net
    depends_on:
      elasticsearch:
        condition: service_healthy
